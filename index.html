<!DOCTYPE html>
<html lang="zh-Hant">
<head>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500&display=swap">
<style>
:root{--warn:#e0a526;--warnbg:#fff3d1;--bg:#f8f1ec;--card:#fff;--ink:#6b6b6b;--head:#4f4f4f;--sub:#8c8c8c;--line:#d6dce2;--pink:#ef7389;--hl:#fbdde2;--hl2:#d9ebf7;--soft:#fdf1f3;--acc:#5aa9d8;--accbg:#e2f1fa;--onacc:#fff;--cta:#e9776a;--oncta:#fff;--bad:#d9566d;--badbg:#fde7ea;

.card{scroll-margin-top:130px}
#r{max-width:720px;margin:0 auto}
.rd{margin:10px 0;line-height:2.2;text-align:left;font-size:17px}

.sr{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:6px 0 2px}
.sb{min-height:38px;padding:0 14px;border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:999px;font:500 14px "Noto Sans TC",sans-serif;cursor:pointer}
.sb.st1.on{background:var(--accbg);border-color:var(--acc);color:var(--acc)}
.sb.st2.on{background:var(--warnbg);border-color:var(--warn);color:var(--head)}

.sc{margin:0 0 10px;padding:6px 14px;border-radius:14px;background:var(--hl2);color:var(--head);font-size:14px;text-align:left}
#a>.pb{scroll-margin-top:70px}
#up{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:8;min-height:44px;padding:0 18px;border:1px solid var(--acc);border-radius:999px;background:var(--card);color:var(--acc);font:500 14px "Noto Sans TC",sans-serif;letter-spacing:.08em;box-shadow:0 2px 8px rgba(0,0,0,.14);cursor:pointer}

.tbar{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:4px 0}
#sb{text-align:center}
header{position:relative}
.go2{display:none;position:absolute;right:0;top:22px;min-height:40px;padding:0 22px;border:0;border-radius:999px;background:var(--cta);color:var(--oncta);font:500 15px "Noto Sans TC",sans-serif;letter-spacing:.12em;cursor:pointer}
@media (min-width:760px){
main{max-width:980px}
#p{max-width:640px;margin:0 auto}
#b{display:grid;grid-template-columns:1fr 1fr;column-gap:24px}
#b>:not(.card){grid-column:1/-1}
#b>.card{margin:18px 0 0}
#cl{display:grid;grid-template-columns:1fr 1fr;column-gap:24px}

#sb .toc{grid-template-columns:repeat(4,1fr)}
.go2{display:inline-block}
#cta{display:none}

}
@media (min-width:1000px){
main{max-width:1240px}
#a{display:grid;grid-template-columns:230px minmax(0,1fr);column-gap:28px;align-items:start}
#a>.lead{grid-column:1/-1}
#sb{position:sticky;top:76px;max-height:calc(100vh - 96px);overflow:auto;padding-right:4px}
#sb .toc{display:grid!important;grid-template-columns:1fr;margin:8px 0}
#tb,#hn,#up{display:none}
#r{max-width:none;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);column-gap:28px;align-items:start}
#r>.lead,#r>.sl{grid-column:1/-1}
#ac{grid-column:1}
#qh{grid-column:2;position:sticky;top:76px}
}
@media (prefers-reduced-motion:no-preference){.card,.chip,.opt,.pb,.go,nav button,#cta,#up,.w{transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease,background-color .18s ease,color .18s ease}}
.opt:active,.chip:active,.go:active,.pb:active{transform:scale(.97)}
@media (hover:hover){
#cl>.card:hover,#b>.card:hover{border-color:var(--pink);box-shadow:0 8px 20px rgba(239,115,137,.22);transform:translateY(-4px)}
#cl>.card:hover .w{background:linear-gradient(transparent 62%,var(--hl) 62%)}
.chip:hover{border-color:var(--pink);background:var(--soft);color:var(--pink)}
.opt:not(.ok):not(.no):hover{border-color:var(--pink);background:var(--soft);transform:translateY(-2px)}
.pb:hover{border-color:var(--pink);color:var(--pink)}
nav button:not([aria-selected="true"]):hover{border-color:var(--acc);color:var(--acc)}
.go:hover{transform:translateY(-2px);filter:brightness(.94)}
#cta:hover{filter:brightness(.94)}
.ex:hover{border-left-color:var(--acc)}
}
.idm{cursor:default}
.hw{border:0;border-bottom:2px dotted var(--acc);background:transparent;color:var(--head);font:inherit;padding:0 1px;margin:0;cursor:help}
.hw:hover,.hw:focus-visible{background:var(--hl2)}
.tipw{position:fixed;z-index:20;max-width:280px;padding:12px 16px;background:var(--card);border:1px solid var(--pink);border-radius:0 18px 18px 18px;box-shadow:0 8px 24px rgba(0,0,0,.18);text-align:left}
.tw{margin:0 0 4px;font:500 22px/1.6 "Noto Sans TC",sans-serif;color:var(--head)}
.tm{margin:0;font-size:15px;line-height:1.7;color:var(--ink)}
.tg{display:inline-block;margin:8px 0 0;padding:0 10px;border-radius:999px;background:var(--hl);color:var(--pink);font-size:12px}
.sl{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:6px 0 12px}
#cl{padding-bottom:60vh}
.card.flash{border-color:var(--pink);box-shadow:0 0 0 4px var(--hl)}
#fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:9;min-height:56px;padding:0 28px;border:0;border-radius:999px;background:var(--cta);color:var(--oncta);font:500 17px "Noto Sans TC",sans-serif;letter-spacing:.2em;box-shadow:0 6px 18px rgba(0,0,0,.22);cursor:pointer}
#fab:hover{filter:brightness(.94)}
.tbl{width:100%;border-collapse:collapse;margin:12px 0;font-size:16px}

@media (min-width:900px){

.eng{font-size:14px}

.zy{font-size:15px}
.zt{font-size:16px}
.m{font-size:19px}
.sc{font-size:17px}
.pb{min-height:42px;font-size:17px}
.sb{min-height:42px;font-size:17px}
.chip{min-height:48px;font-size:18px}
.srch{min-height:48px;font-size:18px}
.q{font-size:23px}
.opt{min-height:54px;font-size:20px}
.go{min-height:52px;font-size:19px}

.tm{font-size:17px}
.tg{font-size:14px}

}

<body>
<main>
<header><h1>會考作文練習</h1><div class="eng">IDIOM &amp; QUOTE PRACTICE</div></header>
<nav role="tablist">
<button role="tab" aria-selected="true" data-t="a">成語</button>
<button role="tab" aria-selected="false" data-t="b">名言佳句</button>
<button role="tab" aria-selected="false" data-t="r">閱讀</button>
</nav>
<section id="a"></section>
<section id="b" hidden></section>
<section id="r" hidden></section>
<section id="p" hidden>
<div id="rg" class="card"></div>
<div id="sn"></div>
<section id="c"></section>
<section id="d" hidden></section>
<section id="f" hidden></section>
<section id="g" hidden></section>
<section id="h" hidden></section>
<section id="i" hidden></section>
</section>
</main>
<button id="fab">練習</button>
<button id="up">↑ 目錄</button>
<script>
const W=[
["持之以恆","長久堅持下去，不中斷。","只要持之以恆地練習寫字，字就會越寫越漂亮。","他持之以恆地早起運動，身體變得很健康。"],
["全力以赴","用盡全部力量去做。","這次會考我會全力以赴，不讓自己後悔。","球隊全力以赴，終於贏得了比賽。"],
["半途而廢","事情做到一半就放棄。","學語言不能半途而廢，不然前面的努力都白費了。","他學了三個月鋼琴就半途而廢，真可惜。"],
["同心協力","大家團結一心，共同努力。","我們班同心協力，終於完成了校慶的布置。","全家人同心協力，把家裡打掃得乾乾淨淨。"],
["集思廣益","集合眾人的意見，想出更好的辦法。","做小組報告時，大家集思廣益，想出了很多好點子。","老師請同學集思廣益，討論班遊的地點。"],
["印象深刻","事情留在心中很清楚，不容易忘記。","那次旅行讓我印象深刻，到現在還記得很清楚。","老師的一句鼓勵，讓我印象深刻。"],
["受益良多","得到很多好處或幫助。","聽了老師的建議，我受益良多。","讀了這本書之後，我受益良多。"],
["心懷感激","心裡充滿感謝。","他幫了我很多，我對他心懷感激。","我對一直照顧我的房東心懷感激。"],
["恍然大悟","突然明白過來。","老師解釋完，我恍然大悟，原來答案這麼簡單。","聽到朋友的說明，我才恍然大悟。"],
["迎刃而解","問題找到方法後，很容易就解決了。","找到方法後，困難就迎刃而解了。","掌握了基本觀念，數學題目就迎刃而解。"],
["鍥而不捨","意志堅定，一直做下去不放棄。","這個字他寫錯很多次，但他鍥而不捨，一直練到寫對為止。","她鍥而不捨地練習發音，現在說得很標準。"],
["越挫越勇","遇到的挫折越多，反而越有勇氣。","他比賽輸了，卻越挫越勇，決定更努力練習。","遇到困難時，我告訴自己要越挫越勇。"],
["腳踏實地","做事踏實認真，不好高騖遠。","做事要腳踏實地，不要只想一步登天。","他腳踏實地地準備考試，每天都複習。"],
["循序漸進","按照順序，一步一步前進。","學中文要循序漸進，不能一開始就學很難的內容。","運動要循序漸進，才不會受傷。"],
["虛心求教","謙虛地向別人請教。","遇到不懂的地方，要虛心求教，向老師請教。","他虛心求教，所以進步很快。"],
["精益求精","已經很好了，還想要更好。","他的作文已經很好，還是精益求精，一直修改。","那位廚師對每一道菜都精益求精。"],
["茅塞頓開","突然想通，心裡豁然開朗。","被同學一點，我茅塞頓開，知道自己錯在哪。","老師講完之後，我茅塞頓開，終於懂了這個文法。"],
["設身處地","站在別人的立場去想。","朋友難過時，要設身處地，想想他的感受。","我們應該設身處地為別人著想。"],
["感同身受","好像自己也親身經歷過一樣。","看到災區的新聞，我感同身受，心裡很難過。","聽了她的故事，大家都感同身受。"],
["樂在其中","很享受做這件事。","他很愛畫畫，每天畫畫都樂在其中。","學習中文讓我樂在其中。"],
["飲水思源","喝水時想到水的來源，比喻不忘本、記得恩情。","我能學會中文是老師的教導，所以我要飲水思源。","成功的時候，要飲水思源，感謝幫助過我們的人。"],
["感恩圖報","感謝別人的恩情，並想辦法回報。","媽媽辛苦照顧我，我長大後要感恩圖報。","他受到老師的幫助，立志將來感恩圖報。"],
["患難與共","在困難的時候一起面對。","在我最困難的時候，朋友與我患難與共。","他們是患難與共的好夥伴。"],
["互相扶持","彼此幫助，互相支持。","同學們互相扶持，一起度過了緊張的考試週。","好朋友應該互相扶持。"],
["不屈不撓","不向困難低頭，不肯放棄。","他不屈不撓地練習，終於通過了中文檢定。","面對失敗，她不屈不撓，繼續努力。"],
["勇往直前","勇敢地向前進，不怕困難。","面對會考，我要勇往直前，不怕困難。","為了夢想，他勇往直前，從不退縮。"],
["盡心盡力","用盡心思和力量去做。","老師盡心盡力地教我，從不覺得麻煩。","她盡心盡力地照顧生病的奶奶。"],
["深思熟慮","仔細周密地思考。","選擇學校是大事，我深思熟慮之後才做決定。","這個決定我深思熟慮了很久。"],
["未雨綢繆","事先做好準備，避免麻煩。","考試前一個月就開始複習，這就是未雨綢繆。","出門前先看天氣預報並帶傘，是未雨綢繆的好習慣。"],
["臨危不亂","遇到危險也能保持鎮定。","火災演習時，他臨危不亂，帶著大家安全走出教室。","遇到意外，我們要臨危不亂。"],
["全神貫注","專心投入，一點也不分心。","上課時他全神貫注地聽老師講解。","畫畫的時候，她全神貫注，連朋友叫她都沒聽見。"],
["不恥下問","不覺得向地位或知識比自己低的人請教是丟臉的事。","他成績很好，遇到不懂的地方，還是不恥下問。","學問再好的人，也要有不恥下問的態度。"],

const AR=[{"t":"我的中文學習之路","p":["剛抵達台灣時，小傑的中文程度十分有限，連向早餐店老闆點一份蛋餅，都顯得[結結巴巴]。每當交談遇到[障礙]，他總是感到[氣餒]，甚至懷疑自己是否適合在這裡生活。他常常在公車上聽不懂廣播，在市場裡聽不清楚老闆報的價錢，只能尷尬地點頭微笑，回到家後總是對著課本嘆氣。","某天，鄰居王奶奶神情認真地告訴他：「學習語言如同[栽種]花木，只要{持之以恆}地[灌溉]，終有開花結果的一天。常言道：『[勤能補拙]』，只要肯努力，就一定追得上別人。」這番話[彷彿]一盞明燈，讓他重新[振作]，決心每天累積[詞彙]，並鼓起勇氣與人交流。他還向王奶奶借了一本舊童話書，每天睡前念一頁，遇到不懂的詞，就先試著從前後文猜意思，再翻字典確認，並把生詞抄在小本子上，走到哪裡都帶著。","半年後，他已經能在市場裡自己問價錢，也能看懂簡單的新聞標題。有一天，他在課堂上聽懂了老師的[幽默]，頓時{恍然大悟}：原來所有的付出，都會在[日積月累]中化為實力。"],"q":[["「這番話彷彿一盞明燈」，意思最接近下列哪一項？","這些話給了他方向和希望","他真的看見了一盞燈","王奶奶送了他一盞燈","他覺得這些話很刺眼","明燈用來比喻指引方向、帶來希望。"],["文章結尾，小傑「恍然大悟」，他領悟了什麼？","努力付出終究會轉化成實力","老師的幽默非常難懂","學語言不需要練習","王奶奶說的話都不是真的","最後一句說，所有的付出都會慢慢化為實力。"],["第二段王奶奶說「終有開花結果的一天」，「開花結果」在文中最可能象徵什麼？","長期努力之後，終於得到成果","小傑搬到有花的地方住","王奶奶的花園非常成功","小傑開始學習種花","王奶奶以栽種花木比喻學語言，開花結果指努力後有成果。",["文中的花木只是比喻，沒有提到搬家。","花園只是用來比喻的例子，不是重點。","小傑學的是語言，不是種花。"]],["為什麼小傑半年後能聽懂老師的幽默？綜合全文，下列推論何者最完整？","受王奶奶鼓勵後，他持續累積詞彙並鼓起勇氣練習，半年下來語言能力提升","他本來中文基礎就很好，只是缺少表現的機會","王奶奶每天都陪他練習對話","他參加了老師開設的特別課程","第一段說他中文有限，第二段寫他決心累積詞彙與人交流，第三段才有成果。",["第一段明說他的中文程度十分有限。","文中沒有說王奶奶每天陪他練習。","文中沒有提到特別課程。"]]]},{"t":"與人工智慧一起學習","p":["近年來，[人工智慧]的發展[日新月異]，許多學生開始向 AI 助理提問，從數學題到作文[構想]，它幾乎都能在幾秒內給出答案。老師和家長也開始討論，是否應該限制學生使用：有人擔心學生會因此變得懶得思考，也有人認為這是時代的趨勢，不應一味禁止。","然而，小宇發現，AI 的回答並非總是正確，有時甚至看似很有把握地[編造]資訊。他提醒自己，必須{深思熟慮}，再決定是否[採用]，而不是全盤接受。他曾經請 AI 介紹一位歷史人物，結果發現其中一段年代是錯的，若不是對照了課本，他恐怕就把錯誤寫進報告裡了。","老師說過，善用工具往往能[事半功倍]。他明白，AI 就像一件工具，只要[善加運用]，並配合自己的思考，原本複雜的難題也會{迎刃而解}。於是他給自己訂了規則：先自己思考，再請 AI 補充；重要的資料，一定到課本或可靠的網站[查證]。同學問他為什麼要這麼麻煩，他說：答案可以借來，理解卻只能自己得到。"],"q":[["小宇在決定是否採用 AI 的回答前，提醒自己要怎麼做？","仔細思考後再決定","馬上全部照做","完全不再使用 AI","請別人代替他決定","他提醒自己必須深思熟慮，而不是全盤接受。"],["這篇文章最想傳達的觀點是？","善用 AI，同時保有自己的思考","學生應該完全依賴 AI","AI 已經取代所有老師","學習不再需要思考","文章強調要善加運用，並配合自己的思考。"],["第二段說 AI「看似很有把握地」編造資訊，其中的「看似」最能顯示作者什麼態度？","提醒讀者：AI 語氣自信，內容卻可能不可靠","稱讚 AI 回答時很有自信","認為 AI 是故意欺騙使用者","認為 AI 的回答一定正確","「看似」表示表面如此，實際未必，是在提醒不要被語氣說服。",["「看似」帶有保留，不是稱讚。","文中沒有說 AI 故意欺騙。","「並非總是正確」與這個選項相反。"]],["如果小宇直接把 AI 的答案抄進作業，依文章，最可能產生什麼問題？","可能抄進錯誤資訊，也錯失運用自己思考的機會","老師會因為效率很高而稱讚他","AI 會因此更新功能","作業一定會變得更正確","第二段說 AI 會編造資訊，第三段強調要配合自己的思考，合起來可推論這個後果。",["文中沒有提到老師會稱讚。","文中沒有提到 AI 會更新。","第二段說 AI 並非總是正確。"]]]},{"t":"讓人敢說真話的團隊","p":["Google 曾經研究過上百個團隊，想知道什麼樣的團隊表現最[卓越]。結果出乎意料：最重要的因素不是成員的才華，而是「[心理安全感]」，也就是大家敢於提出想法、承認錯誤，而不必擔心被嘲笑。這個結果讓許多人重新思考：與其只挑選最聰明的人，也許更重要的是讓每個人都敢開口。","在這樣的團隊裡，成員可以[暢所欲言]，遇到問題時也能{集思廣益}，而不是把意見藏在心裡。當有人犯錯，大家會{設身處地}想一想，與其責怪，不如一起找出改進的辦法。例如在一場討論裡，新來的成員可以放心地問：「這個步驟我不太懂，可以再解釋一次嗎？」而不必擔心被人認為很笨。這樣的提問，往往能讓團隊發現原本被忽略的問題。","這項研究提醒我們，一個[包容]的環境，往往比單純追求效率更能[激發]潛力。換句話說，好的團隊不是沒有意見分歧，而是讓不同的聲音都有被[傾聽]的機會。因此，無論是在公司還是在班級，營造讓人安心表達的氛圍，才是團隊進步的關鍵。"],"q":[["當有人犯錯時，文章認為團隊比較好的做法是？","一起找出改進的辦法","公開責備他","假裝沒看見","立刻請他離開","第二段說與其責怪，不如一起找出改進的辦法。"],["這篇文章最後想提醒我們什麼？","營造能安心表達的氛圍，是團隊進步的關鍵","只要追求效率就夠了","團隊成員越少越好","錯誤一定要避免被人發現","最後一句說，營造安心表達的氛圍是團隊進步的關鍵。"],["第一段說「結果出乎意料」，作者的用意最可能是什麼？","暗示多數人原本以為才華最重要，結果卻不是","表示這項研究失敗了","說明 Google 不重視人才","表示研究結果沒有意義","「出乎意料」表示與一般預期不同，而下文說最重要的不是才華。",["下文有清楚的研究結論，不是失敗。","文中沒有說 Google 不重視人才。","結果被作者當成重要的提醒。"]],["如果某個班級的同學因為害怕被嘲笑，很少在課堂上發言，依本文觀點，最合理的改善方向是什麼？","營造能安心表達的氛圍，讓大家敢提出想法","要求每個人只負責自己的部分","提高考試的難度","減少小組討論的時間","文章主張心理安全感是關鍵，所以要讓成員不怕被嘲笑地表達。",["這不能解決害怕被嘲笑的問題。","文章沒有談考試難度。","減少討論會讓表達機會更少。"]]]},{"t":"從英文影片學知識","p":["小安從小就習慣觀看英文 YouTube，從科學實驗到太空探索，他總是{全神貫注}地看完整支影片。起初他只能依靠字幕，後來漸漸能聽懂關鍵字詞，甚至[模仿]主持人的語調。遇到不懂的單字，他不會立刻放棄，而是先從前後文[推測]意思，再查字典確認，並把句子抄在筆記本裡。","然而，網路上的資訊[良莠不齊]，並非每支影片都可靠。小安學會了[查證]來源，也會比較不同頻道的說法。有一次，一位老師的講解讓他{茅塞頓開}，原來自己先前誤解了一個科學概念。他也發現，有些影片為了吸引點閱，會把話說得特別誇張；因此，遇到令人驚訝的說法時，他會先暫停，再去搜尋可靠的資料來源。","古人說：「[兼聽則明]。」多參考不同來源，才不容易被單一觀點[誤導]。他也開始把學到的知識用中文講給同學聽，因為他發現，能把一件事說清楚，才算真正懂了。小安相信，只要保持好奇心與判斷力，網路就能成為他[拓展]視野的最好教室。"],"q":[["小安為什麼要查證來源？","因為網路資訊良莠不齊，不一定可靠","因為影片太短","因為字幕太難","因為不想看影片","第二段說網路資訊良莠不齊，所以他學會查證來源。"],["這篇文章主要想傳達什麼？","保持好奇與判斷力，網路可以幫助學習","網路上的資訊都不可信","學習只能靠書本","看影片會讓人變笨","最後一句說保持好奇心與判斷力，網路能成為最好的教室。"],["第二段開頭的「然而」，在文章中的作用是什麼？","由第一段的優點，轉向提醒網路資訊的缺點","繼續稱讚英文影片","表示小安不再看影片","表示小安放棄學英文","「然而」表示轉折，後面談網路資訊良莠不齊。",["「然而」是轉折，不是繼續稱讚。","文章後面小安仍然在看影片。","文中沒有提到他放棄英文。"]],["小安「原來自己先前誤解了一個科學概念」，綜合第二段，最合理的推論是什麼？","他比較過不同來源，才發現先前的理解有誤","他從沒看過其他影片，是老師主動聯絡他","他聽不懂英文，所以全靠猜測","他不信任影片，所以全部放棄","第二段說他學會查證並比較不同頻道，之後才在老師的講解中發現誤解。",["文中沒有說老師主動聯絡他。","第一段說他漸漸能聽懂字詞。","文章最後他仍然肯定網路的價值。"]]]},{"t":"蜘蛛人的啟示","p":["蜘蛛人於 1962 年首度在漫畫中登場，由作家史丹·李與畫家史蒂夫·迪特科共同創作。與許多出身[顯赫]的英雄不同，主角彼得·帕克只是個[平凡]的高中生，既要煩惱功課，也要擔心家裡的生活開銷。他住在普通的街區，要趕公車、要準時交作業，有時還會因為忙著救人而遲到被罵。","一次意外，他被一隻特殊的蜘蛛咬傷，從此擁有[敏捷]的身手與超乎常人的力量。起初，他把這些能力當作炫耀的工具，直到親人因他的[疏忽]而遭遇不幸，他才{恍然大悟}：力量越大，責任也越重。後來，他曾經一度想放下這個身分，卻發現自己沒辦法裝作沒看見需要幫助的人。","此後，無論面對多麼強大的敵人，他都{全力以赴}，守護這座城市。蜘蛛人之所以深受喜愛，不只是因為精采的戰鬥場面，更因為他在[兩難]之間依然[擔當]起責任。也有許多讀者表示，正因為他會失誤、會害怕，卻仍然選擇站出來，這個角色才顯得真實而可親。這份精神，使這個角色[歷久不衰]。"],"q":[["「力量越大，責任也越重」想表達什麼意思？","擁有能力的人，應該承擔相對的責任","力量越大，越可以隨心所欲","責任和力量毫無關係","只有普通人才需要負責","能力愈強，愈應該負責，這是蜘蛛人領悟的道理。"],["作者認為蜘蛛人深受喜愛的最主要原因是什麼？","他在兩難之間依然願意承擔責任","他的戰鬥場面比其他英雄更精采","他是所有英雄中最有錢的","他從來不會犯錯","第三段說不只是戰鬥場面，更因為他在兩難中仍擔起責任。"],["第二段說他「起初」把能力當作炫耀的工具，作者使用「起初」的用意是什麼？","暗示他當時還不成熟，為後面的領悟做鋪陳","稱讚他懂得運用能力","責怪他沒有早點離開家","說明他的能力其實沒有用","「起初」表示後來有改變，與「直到…才恍然大悟」互相呼應。",["文章沒有稱讚他炫耀。","文中沒有提到離家。","文章說他擁有超乎常人的力量。"]],["綜合第一段與第三段，蜘蛛人能引起讀者共鳴，最主要的原因是什麼？","他是有能力的英雄，也有一般人的煩惱，並在兩難中選擇承擔","他出身顯赫，所以令人羨慕","他的力量比所有英雄都強","他從不為生活煩惱","第一段寫他平凡又有煩惱，第三段寫他在兩難中擔起責任，兩者結合才有共鳴。",["第一段說他不是出身顯赫的英雄。","文中沒有比較力量大小。","第一段說他要擔心生活開銷。"]]]},{"t":"外婆的菜園","p":["外婆的菜園就在老家後面，不過[巴掌大]，卻種滿了絲瓜、地瓜葉和幾排青蔥。外婆的手背上布滿[皺紋]，卻總能在天色還暗時，一眼分辨出哪一排是剛冒芽的青菜。小時候，我最怕暑假被送回鄉下，因為那裡沒有冷氣，也沒有電動玩具。每天清晨，外婆總是天未亮就拉著我到菜園澆水，我一邊打哈欠，一邊嘟囔著：「買菜不就好了，何必這麼辛苦？」外婆只是笑了笑，沒有回答。","有一年夏天，颱風過後，菜園被吹得[東倒西歪]，我以為外婆會難過，沒想到她挽起袖子，一株一株地把倒下的菜苗扶正，還邊扶邊哼著小曲。雨後的空氣濕潤，帶著青草的清香。我忍不住蹲下來幫忙，指尖沾滿了泥土，卻第一次覺得，那泥土的氣味竟然這麼[踏實]。","後來我上了國中，回鄉的次數越來越少。去年外婆搬到城裡，菜園也[荒廢]了，可是每當我在超市看見一把青蔥，就會想起那個清晨，還有外婆蹲在田裡的背影。我後來聽媽媽說，外婆每天澆水時，其實也會跟菜苗說話，像是在[叮嚀]自己的家人。我才明白，她種的從來不只是菜，而是一份不被風雨打倒的[溫柔]。"],"q":[["「外婆只是笑了笑，沒有回答」，最可能的原因是什麼？","外婆認為用行動比用言語，更能讓孫子明白種菜的意義","外婆沒有聽見孫子的抱怨","外婆覺得孫子的問題很愚蠢","外婆其實也不知道該怎麼回答","後文外婆用扶起菜苗的行動，讓「我」體會踏實，可見她不靠言語解釋。",["文中沒有說外婆沒聽見，她後來的行動也顯示她很清楚。","外婆始終溫和，文章沒有輕視孫子的描寫。","外婆後來的行動非常堅定，並不是不知道。"]],["下列敘述，何者「不符合」文意？","作者現在仍然每年暑假回鄉，幫外婆種菜","作者小時候不喜歡暑假回鄉下","外婆搬到城裡後，菜園逐漸荒廢","作者在超市看見青蔥，會想起外婆","第三段說「回鄉的次數越來越少」，所以不是每年暑假都回去種菜。",["第一段有寫，這是符合文意的敘述。","第三段有寫，這是符合文意的敘述。","第三段有寫，這是符合文意的敘述。"]],["第二段說「那泥土的氣味竟然這麼踏實」，其中的「竟然」表現「我」什麼心情？","對自己有這樣的感受感到意外","對外婆感到生氣","對泥土感到噁心","對颱風感到害怕","「竟然」表示與預期不同，「我」原本抗拒，卻意外地覺得踏實。",["文中沒有生氣的描寫。","文中說的是踏實，不是噁心。","這句重點在泥土的感受，不是害怕。"]],["綜合全文，「我」一開始問外婆「何必這麼辛苦」，最後怎麼得到答案？","外婆沒有直接回答，「我」透過颱風後的情景與日後的回憶，自己領悟","外婆後來在電話中直接解釋","「我」讀了書才明白","「我」到最後仍不明白","第一段外婆沒回答，第二段親身幫忙，第三段以回憶總結，才說「我才明白」。",["文中沒有提到電話。","文中沒有提到讀書。","末句說「我才明白」，所以不是不明白。"]]]},{"t":"為什麼天空是藍色的","p":["晴朗的白天，抬頭望去，天空總是一片[湛藍]。這個再平常不過的現象，背後卻藏著有趣的科學道理。不論是在海邊、草原還是城市，只要天氣晴朗，抬頭看見的總是同一種藍。","太陽光看起來是白色的，其實是由紅、橙、黃、綠、藍、靛、紫等各種顏色的光混合而成。當陽光進入[大氣層]，會遇到空氣中的氣體分子。這些分子會把光線朝四面八方[散射]開來，而且[波長]越短的光，被散射得越厲害。藍光的波長比紅光短，因此在天空中被散射得特別多，遍布整個天空，我們看到的天空便呈現藍色。","那麼，紫光的波長更短，天空為什麼不是紫色呢？這是因為陽光中的紫光本來就比較少，加上我們的眼睛對藍光比對紫光更[敏感]，所以最後感受到的主要是藍色。科學家因此特別重視光的波長，因為不同的波長，讓我們看見不同的顏色。","到了日出或日落時，陽光必須穿過更厚的大氣層才能到達我們眼中，大部分藍光在途中已被散射到其他方向，剩下的紅光、橙光便讓天邊染上一片橘紅。同樣的道理，也讓清晨和傍晚的天空，常常出現橘紅、粉紅等柔和的色彩。"],"q":[["下列關於天空顏色的說明，何者「錯誤」？","紫光的波長比藍光長，所以比較少被散射","波長較短的光，比較容易被散射","人眼對藍光比對紫光敏感","日落時，大部分藍光在途中已被散射到其他方向","文中說紫光的波長比藍光更短，所以「紫光波長較長」是錯誤的。",["這是文章的說法，是正確的敘述。","第三段有寫，是正確的敘述。","第四段有寫，是正確的敘述。"]],["下列哪一種現象，最能支持「光穿過的大氣越厚，藍光被散射掉得越多」？","日落時，天邊呈現橘紅色","正午的天空是藍色的","夜晚看不到太陽","雲看起來是白色的","日落時光走較長的路，藍光被散射掉，剩下紅橙光，正好支持這個說法。",["這是一般的藍天現象，沒有比較光穿過大氣厚度的差異。","這與大氣厚度和藍光散射無關。","雲的顏色不是本文討論的重點。"]],["第三段開頭問「天空為什麼不是紫色呢」，作者提出這個問句的目的是什麼？","預先提出讀者可能的疑問，再加以解答","表示作者也不知道答案","質疑前面的說明是錯的","邀請讀者自己做實驗","前面說波長越短越容易被散射，讀者可能會問紫光，作者先提出再說明。",["作者在下文給了解釋。","問句是補充說明，不是質疑。","文中沒有提到實驗。"]],["如果在一個完全沒有大氣層的星球上看天空，最可能是什麼樣子？","接近黑色，因為沒有氣體分子把光散射到各個方向","和地球一樣是藍色","一片紅色","一片白色","文章說藍天來自氣體分子散射陽光，沒有大氣就沒有散射，天空看起來是黑的。",["沒有氣體分子，就沒有藍光被散射。","沒有散射，也不會變成紅色。","沒有散射，天空不會佈滿白光。"]]]},{"t":"失敗是不是浪費","p":["許多人把失敗視為丟臉的事，彷彿一次跌倒，便代表自己不夠好。在許多人的印象裡，成功才值得被稱讚，失敗則是需要被遮掩的。然而，失敗真的毫無價值嗎？","愛迪生研發電燈時，曾嘗試過許多種材料，每一次不成功，他都將結果記錄下來，相傳還說自己只是「又找到一種不適合的方法」。如果他當初因為[屢次]失敗就放棄，後人也許還要在黑暗中[摸索]更久。可見，失敗本身並不可怕，可怕的是失敗之後，一無所獲。","有人也許會[反駁]：許多人努力了很久，最後仍然沒有成功，這些時間豈不是白白浪費？但我認為，只要用心[檢討]，失敗所累積的經驗與判斷力，都會成為下一次行動的基礎；反過來說，若只是一再重複相同的錯誤，卻不肯回頭反省，那麼即使成功了，也只是[僥倖]。例如一位學生月考考砸了，如果他仔細整理錯題、找出弱點，這次的失敗就成了下次進步的起點。","換句話說，失敗本身只是過程，真正決定它有沒有價值的，是我們面對它的態度。因此，失敗是不是浪費，關鍵不在結果，而在於我們是否從中學習。"],"q":[["作者認為「失敗之後，一無所獲」比失敗本身更可怕，最主要的理由是什麼？","失敗若沒有帶來經驗與反省，努力就失去累積的價值","失敗是一件丟臉的事，無法避免","沒有成果，就代表一個人不夠努力","別人會嘲笑沒有收穫的人","作者強調關鍵是能否從失敗中學習，沒有收穫才是真正的浪費。",["這是第一段提到的看法，作者並不同意。","作者沒有這樣說，他重視的是有沒有學習。","文章沒有談到別人的看法。"]],["下列敘述，何者「不符合」作者的看法？","只要最後成功了，過程中的失敗就沒有任何意義","用心檢討的失敗，能累積判斷力","不肯反省的成功，只是僥倖","失敗是不是浪費，關鍵在是否學習","作者認為失敗中的經驗與判斷力，是下一次行動的基礎，並非沒有意義。",["第三段有寫，符合作者的看法。","第三段有寫，符合作者的看法。","第四段的結論，符合作者的看法。"]],["第二段說「可見，失敗本身並不可怕，可怕的是失敗之後，一無所獲」，這句話的作用是什麼？","由例子歸納出觀點，並把「可怕」的重點轉移到有沒有收穫","質疑愛迪生的做法","表示失敗一定很可怕","說明電燈的發明過程","「可見」表示由前面的例子得出結論，並把重點放在是否一無所獲。",["作者是借愛迪生的例子支持論點。","句中說失敗本身並不可怕。","作者的目的是歸納觀點，不是說明過程。"]],["如果有人說：「失敗太多次了，乾脆放棄比較省時間」，依本文，作者最可能怎麼回應？","重點不是次數，而是每次失敗後有沒有檢討並累積經驗","同意，放棄最省時間","失敗只要多做幾次，就會自動成功","失敗不需要檢討","作者主張失敗是否浪費，關鍵在是否從中學習，而不是次數。",["作者並不同意放棄就是最好。","作者反對一再重複相同的錯誤。","作者強調檢討的重要。"]]]},{"t":"班級課後時間調查","p":["下表是某國中三個班級的調查結果，包含各班人數、平均每人每天使用手機娛樂的時間（單位：分鐘），以及段考國文平均分數。（資料為虛構，僅供練習）","小明看了資料後說：「手機使用時間越長，國文成績就越差，所以只要少用手機，成績就會進步。」"],"tbl":{"h":["班級","人數","平日手機（分鐘／天）","週末手機（分鐘／天）","國文段考平均"],"r":[["甲班","30","40","120","78"],["乙班","25","60","150","74"],["丙班","35","90","180","70"]]},"q":[["丙班週末全班每天使用手機娛樂的時間，合計約多少小時？","105 小時","90 小時","63 小時","120 小時","180 分鐘 × 35 人 ＝ 6300 分鐘，6300 ÷ 60 ＝ 105 小時。",["90 小時是用甲班的 30 人算出來的，丙班有 35 人。","6300 分鐘要除以 60 才是小時，除以 100 是錯的。","180 × 35 ＝ 6300 分鐘，÷ 60 是 105 小時，不是 120。"]],["三個班合起來，全體學生平日使用手機娛樂的平均時間，最接近多少？","65 分鐘","63 分鐘","70 分鐘","60 分鐘","各班人數不同，要加權平均：(40×30＋60×25＋90×35)÷90 ＝ 5850 ÷ 90 ＝ 65 分鐘。",["63 分鐘是把三個數字直接平均，沒有考慮各班人數不同。","70 分鐘高於實際計算結果。","60 分鐘低於實際計算結果，而且只是乙班的數字。"]],["針對小明的說法，依表格資料，下列何者最恰當？","表格只顯示兩者一起變化，不能證明手機使用造成成績下降","表格證明手機使用越久，成績一定越差","表格顯示成績越好的班級，手機使用越久","因為只有三個班，所以資料完全沒有意義","表中手機時間越長的班，國文平均越低，但這是相關，還有其他可能因素，無法直接證明因果。",["表格呈現的是相關，並沒有證明因果，「一定」說得太肯定。","表中國文平均最高的甲班，手機時間反而最短。","三個班仍然可以看出趨勢，只是不足以證明因果，不是完全沒有意義。"]],["下列哪一項敘述，最符合表格資料？","每個班級的週末手機時間，都比平日增加 80 至 90 分鐘","乙班週末手機時間是平日的兩倍","丙班的國文平均比甲班高","人數最多的班級，手機使用時間最短","甲 120－40＝80，乙 150－60＝90，丙 180－90＝90，都在 80 至 90 分鐘。",["150 ÷ 60 ＝ 2.5，不是兩倍。","丙班 70 分，甲班 78 分，丙班比較低。","人數最多的是丙班，他們的手機時間反而最長。"]]]},{"t":"找回夜晚的星空","p":["夜晚的天空原本應該[澄澈]而深邃，滿天星斗清晰可見。然而在大城市裡，抬頭望去往往只剩下稀稀疏疏的幾顆星，許多人早已[習以為常]，甚至不知道自己的頭頂本來有一片銀河。","造成這種現象的主要原因是[光害]。街燈、招牌和大樓的燈光，把光線散射到空中，使夜空變得明亮，微弱的星光因此被[遮蔽]。對天文愛好者來說，能在一片漆黑的山上看見銀河，是{夢寐以求}的事；而這樣的機會，在今日的都市附近已{得來不易}，天文台也因此常常選擇遠離城市、人口稀少的高山或離島。","光害影響的不只是人類。海邊剛孵化的小海龜，會朝著海面較明亮的方向爬向大海；如果岸上的燈光太亮，牠們就可能被[干擾]而迷失方向，無法順利回到海裡。有些研究也發現，夜間過多的燈光會影響候鳥遷徙的路線。因此，有些地區開始替路燈加上[燈罩]，讓光線只照向地面，並在深夜適度關燈。","要讓星空重新出現，並不需要完全放棄夜晚的照明，而是要重新思考「需要多亮」與「照向哪裡」。當每一盞燈都只照亮真正需要的地方，我們才有機會再次抬頭，看見那片被遺忘已久的銀河。"],"q":[["（字詞）文中「澄澈」一詞，最適合用來形容下列何者？","清淨透明、沒有雜質的樣子","寬廣遼闊、一眼望不到邊","顏色鮮豔、色彩豐富","安靜無聲、沒有人煙","「澄澈」形容像乾淨的水或空氣一樣透明，沒有雜質。",["那是「遼闊」的意思，不是澄澈。","澄澈與顏色是否鮮豔無關。","澄澈形容清透，不是安靜。"]],["（句意）「微弱的星光因此被遮蔽」，這句話的意思最接近下列何者？","星光被強烈的人造光比下去，因而看不清楚","星星本身已經熄滅了","雲層擋住了所有的星星","星星變得比以前更亮","文中說光害使夜空變亮，所以微弱的星光看不清楚，並不是星星消失。",["星星還在，只是被燈光蓋過去。","文中沒有提到雲層。","夜空變亮，星光反而更難被看見。"]],["（推論）如果某座海邊城市的沙灘上燈光十分明亮，依文章推論，最可能出現什麼情況？","剛孵化的小海龜可能被燈光干擾，迷失方向","海水的溫度會立刻上升","海龜的數量會因此快速增加","沙灘上的垃圾會自動減少","第三段說，岸上燈光太亮會干擾小海龜，使牠們迷失方向。",["文章沒有說燈光會改變水溫。","燈光會干擾海龜，不會讓數量增加。","文中沒有提到垃圾。"]],["（分析）下列哪一個標題，最適合用來取代本文標題「找回夜晚的星空」？","當燈光太亮，我們失去了什麼","都市夜景的迷人魅力","小海龜的成長日記","天文望遠鏡的選購指南","全文談光害讓人們失去星空，也影響動物，這個標題最能涵蓋重點。",["文章是在談光害的問題，不是稱讚夜景。","海龜只是第三段的一個例子。","文章沒有介紹如何選購望遠鏡。"]]]},{"t":"看不見的塑膠","p":["你知道嗎？有一種塑膠小到肉眼幾乎看不見，卻無所不在。科學家把直徑小於五毫米的塑膠碎片稱為「[微塑膠]」，它們可能來自破裂的塑膠袋，也可能來自洗衣服時掉落的[纖維]，並隨著空氣、水流和食物，悄悄進入我們的生活。","這些微塑膠會隨著水流進入河川與海洋，被小魚和浮游生物[吞食]，再一層一層被更大的生物吃下，最後可能出現在人類的餐桌上，這就是[食物鏈]的循環。這些塑膠碎片很難分解，會在環境中停留很久。科學家目前仍在研究它們對健康的長期影響，但可以確定的是，它們一旦進入環境，就很難被清除。","面對這個問題，與其等污染發生後才清理，不如從[源頭]減量。例如減少使用一次性塑膠袋與吸管，或選擇天然材質的衣物，都是{深思熟慮}後可以做到的小改變。這些做法雖然無法讓問題{迎刃而解}，但環境問題往往是[日積月累]造成的，只要我們懂得[防微杜漸]，就能讓大海少一分負擔。","改變不必一次到位。從每天少用一個塑膠袋開始，也許看似微不足道，但當許多人同時行動，累積的力量就足以改變這片海洋的未來。"],"q":[["（字詞）文中「源頭」一詞，最適合解釋為下列何者？","事物最初產生的地方","水流最快的地方","河川最下游的地方","事情最後的結果","「源頭」指水或事物開始的地方，所以從源頭減量是指從一開始就少用。",["源頭與水流速度無關。","下游是水流的終點，與源頭相反。","源頭指起點，不是結果。"]],["（文意）下列哪一項敘述，最符合文章中微塑膠進入人類餐桌的過程？","被小魚和浮游生物吞食後，沿食物鏈傳到較大的生物，最後被人類食用","人類直接在海底把塑膠撈起來烹煮","河川把塑膠直接送進餐廳的廚房","塑膠被太陽曬成食物的原料","第二段依序說明：被小生物吞食、被更大生物吃下、最後可能到人類餐桌。",["文中沒有這樣的過程。","文中沒有提到河川把塑膠送進餐廳。","文中沒有提到塑膠變成食物原料。"]],["（推論）如果某條河川的上游有許多洗滌衣物的工廠，依文章推論，下游海域最可能出現什麼情況？","可能出現較多來自衣物纖維的微塑膠","海水會因此變甜","魚類的數量一定會增加","微塑膠會在短時間內自行消失","第一段說洗衣服掉落的纖維是微塑膠的來源，第二段說它們很難被清除。",["文章完全沒有提到海水變甜。","文中沒有說魚的數量會增加。","第二段說微塑膠很難分解、很難清除。"]],["（分析）下列哪一個標題，最適合用來取代本文標題「看不見的塑膠」？","隱藏在海洋裡的小危機","一次性吸管的發明史","廚房裡的新食譜","海洋生物的繁殖方式","全文談微塑膠不易被發現，卻影響海洋與食物鏈，所以這個標題最貼切。",["文章不是在講吸管的歷史。","文章與食譜無關。","文章不是在談生物繁殖。"]]]}];

subs.forEach(x=>{const b=el("button","pb",x[1]);b.dataset.k=x[0];b.style.margin="0";b.onclick=()=>pick(x[0]);SN.append(b)});
pick("c");upd();
let last="a";const NB=document.querySelectorAll("nav button"),fab=$("#fab");
fab.onclick=()=>{if(!$("#p").hidden){NB.forEach(b=>{if(b.dataset.t===last)b.click()});return}["a","b","r"].forEach(k=>$("#"+k).hidden=true);$("#p").hidden=false;NB.forEach(b=>b.setAttribute("aria-selected",false));$("#up").hidden=true;fab.textContent="← 返回";window.scrollTo(0,0)};
$("#up").onclick=()=>{tg(true);tb.scrollIntoView({behavior:"smooth",block:"start"})};
// Tabs
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{
document.querySelectorAll("nav button").forEach(x=>x.setAttribute("aria-selected",x===b));
last=b.dataset.t;["a","b","r","p"].forEach(k=>$("#"+k).hidden=k!==last);fab.textContent="練習";$("#up").hidden=last!=="a";window.scrollTo(0,0)});
</script>
